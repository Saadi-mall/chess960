# Build and load the image first - see k8s/README.md.
#
# replicas is 1, deliberately: games live in each backend instance's memory (see
# docs/DECISIONS.md), so two replicas behind one Service would silently break
# multiplayer the moment two different clients - say, two friends joining the same
# game from their own devices - got load-balanced onto different pods, each with no
# idea the other's game exists. Scaling this past one replica needs the game state
# moved to something shared (Redis, most likely) first.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Spring Boot fails fast (and the pod crash-loops) if Postgres isn't reachable the
      # moment it starts - this waits for the Service to actually answer first, the same
      # job docker-compose.yml's `depends_on: condition: service_healthy` does there.
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done
      containers:
        - name: backend
          image: chess960-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
