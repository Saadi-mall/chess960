# Render Blueprint for the backend (Java + Stockfish). The frontend is on Vercel (see
# frontend/vercel.json) and the database on Supabase - see docs/DEPLOY.md.
services:
  - type: web
    name: chess960-backend
    runtime: docker
    plan: free
    # Same area as the Supabase project (AWS us-east-1), so database calls stay fast.
    region: virginia
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
    envVars:
      # Filled in on Render's dashboard from Supabase's "Session pooler" connection details.
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SCHEMA
        value: chess960
      - key: SECURE_COOKIE
        value: "true"
      - key: ALLOWED_ORIGINS
        value: "https://*.vercel.app"
      # Where links in emails point. Only used if email is set up (BREVO_API_KEY and
      # MAIL_FROM_ADDRESS on Render's dashboard); without it, sign-up needs no email.
      - key: APP_BASE_URL
        value: "https://chess960-rho.vercel.app"
