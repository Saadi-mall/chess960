spring:
  application:
    name: chess960-backend
  datasource:
    # A hosted database (e.g. Supabase) sets DB_URL whole, with ?sslmode=require; locally
    # and in Docker Compose / Kubernetes the URL is built from host, port and name.
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chess960}}
    username: ${DB_USER:chess960}
    password: ${DB_PASSWORD:chess960}
    hikari:
      # Small by default: free hosted Postgres plans cap connections, and this app needs few.
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:public}
  flyway:
    enabled: true
    # On Supabase this is "chess960", not "public": Supabase's auto-generated data API
    # exposes tables in "public" to anyone with the project's public key unless row-level
    # security is set up, and this app's tables (users!) shouldn't be reachable that way.
    schemas: ${DB_SCHEMA:public}
    default-schema: ${DB_SCHEMA:public}

server:
  # Hosts like Render tell the app which port to listen on through PORT.
  port: ${PORT:8080}

chess960:
  # On Debian/Ubuntu (the container image) apt installs it to /usr/games, which isn't
  # on PATH; local dev (Homebrew, etc.) usually just has it on PATH as "stockfish".
  stockfish-path: ${STOCKFISH_PATH:stockfish}
  # Where emailed links point - the frontend's address.
  app-base-url: ${APP_BASE_URL:http://localhost:5173}
  mail:
    # Brevo (brevo.com) transactional email. With no key, sign-up skips email confirmation
    # and creates the account straight away; LOG_EMAILS_WHEN_UNCONFIGURED=true logs the
    # confirmation link instead, to try that flow locally without an email account.
    brevo-api-key: ${BREVO_API_KEY:}
    from-address: ${MAIL_FROM_ADDRESS:}
    from-name: ${MAIL_FROM_NAME:Chess960}
    log-when-unconfigured: ${LOG_EMAILS_WHEN_UNCONFIGURED:false}
  # Origins allowed to open a game WebSocket - see WebSocketConfig.
  allowed-origins: ${ALLOWED_ORIGINS:*}
  auth:
    # Marks the session cookie Secure (HTTPS only). Off by default because local dev and
    # the demo Kubernetes setup serve plain HTTP; turn it on wherever TLS is in front.
    secure-cookie: ${SECURE_COOKIE:false}

management:
  endpoints:
    web:
      exposure:
        include: health
